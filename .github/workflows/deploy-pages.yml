name: Test & Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 只需要讀取權限 + 部署 Pages 需要的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只允許一個部署在跑，新的 push 進來就取消舊的（但不要取消正在進行中的部署）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: 執行 pytest（不需要連線 Ollama）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

  build:
    name: 打包 docs/ 成 Pages artifact
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
